[project]
name = "motus-leap"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "google-api-python-client>=2.100.0",
    "httpx>=0.27.0",
    "aiofiles>=23.0.0",
    "slowapi>=0.1.9",
    "orjson>=3.9.0",
    "certifi>=2023.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "passlib>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
