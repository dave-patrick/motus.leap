<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <title>Playlist - motus.leap</title>
    <link rel="icon" type="image/png" href="/static/favicon.png?v=20260717e">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=20260717e">
    <link rel="manifest" href="/static/manifest.json">
        <script src="/static/shared-shell.js?v=20260720c"></script>
<link rel="preconnect" href="https://cdn.tailwindcss.com">
<script src="https://cdn.tailwindcss.com" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121419; color: #e5e5e5; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .bento-card { background-color: #1a1d24; border: 1px solid #2a2f3a; border-radius: 12px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; } ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        .video-row { border-top: 1px solid #2a2f3a; padding: 8px 12px; transition: background-color 0.2s; }
        .video-row:hover { background-color: #20242c; }
        .video-row.selected { background-color: rgba(47, 143, 201, 0.2); }
        
        @keyframes slide-in {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slide-out {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100%); }
        }
        .animate-slide-in { animation: slide-in 0.3s ease-out; }
        .animate-slide-out { animation: slide-out 0.3s ease-in; }
    
        @font-face {
            font-family: 'Deltha';
            src: url('/static/Deltha.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        .site-title { font-family: 'Deltha', serif; font-weight: normal !important; }
        .nav-item.active { background-color: #2f8fc9; color: #ffffff; }
        .nav-item:not(.active):hover { background-color: rgba(255, 255, 255, 0.1); }
</style>
    <link rel="stylesheet" href="/static/ux-enhancements.css?v=20260720c">
    <script src="/static/ux-enhancements.js?v=20260720c"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="/static/global_scripts.js?v=1781919149"></script>
    <script src="/static/auth-check.js?v=1781919149"></script>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#2f8fc9]/30">
    <!-- ===== FULL-WIDTH TOP HEADER ===== -->
    <div class="flex flex-1 min-h-0">
    <main class="flex-1 overflow-y-auto p-4 bg-[#121419]">
            <div class="flex flex-col gap-3 max-w-[1600px] mx-auto w-full">
                <!-- Playlist Context Header Bar -->
                <div class="px-5 py-3 bg-[#16191f] border border-[#2a2f3a] rounded-xl flex items-center justify-between gap-3 shrink-0 shadow-md">
                    <div class="flex items-center gap-3">
                        <a href="/playlists" class="px-3.5 py-1.5 rounded-lg bg-[#20242c] hover:bg-[#2f8fc9] text-white text-xs font-semibold flex items-center gap-2 transition-all duration-200 shadow-sm cursor-pointer">
                            <i class="fa-solid fa-arrow-left"></i> Back to Playlists
                        </a>
                        <span class="text-gray-600">|</span>
                        <span class="text-xs md:text-sm font-semibold text-white truncate" id="playlist-title">Loading...</span>
                        <span class="text-[10px] text-gray-500" id="playlist-meta">-- videos</span>
                    </div>
                    <div id="playlist-exclusion-container">
                        <label class="flex items-center gap-2 text-xs text-gray-300 hover:text-white cursor-pointer select-none bg-[#20242c] border border-[#2a2f3a] px-3 py-1.5 rounded-lg transition-colors">
                            <input type="checkbox" id="exclude-playlist-single-toggle" class="accent-[#eab308]">
                            <i class="fa-solid fa-shield-halved text-[#eab308]"></i> Exclude from Mapping/AI
                        </label>
                    </div>
                </div>

                <!-- Sticky Operations & Control Bar Container -->

                <div class="sticky top-0 z-30 bg-[#121419] pb-2 space-y-3 shadow-xl" style="position: sticky; top: 0; z-index: 40; background-color: #121419;">
                    <!-- Operations Panel (Scan Buttons and Results Box) -->
                    <div class="bento-card p-4 flex flex-col gap-3 shrink-0">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="text-xs font-semibold text-white">Playlist Operations</h3>
                                <p class="text-[10px] text-gray-400">Rescan videos, scan for duplicate entries, or detect misplaced videos based on your rules.</p>
                            </div>
                            <div class="flex gap-2">
                                <button id="rescan-playlist-btn" class="bg-[#20242c] hover:bg-[#2a2f3a] border border-[#2a2f3a] text-gray-300 text-[11px] font-semibold px-4 py-2.5 rounded-lg flex items-center gap-1.5 transition-colors"><i class="fa-solid fa-arrows-rotate text-[#2f8fc9]"></i> Rescan Playlist</button>
                                <button id="btn-scan-dup" class="bg-[#20242c] hover:bg-[#2a2f3a] border border-[#2a2f3a] text-gray-300 text-[11px] font-semibold px-4 py-2.5 rounded-lg flex items-center gap-1.5 transition-all"><i class="fa-solid fa-copy text-[#2f8fc9]"></i> Scan for Duplicates</button>
                                <button id="btn-scan-mis" class="bg-[#20242c] hover:bg-[#2a2f3a] border border-[#2a2f3a] text-gray-300 text-[11px] font-semibold px-4 py-2.5 rounded-lg flex items-center gap-1.5 transition-all"><i class="fa-solid fa-triangle-exclamation text-yellow-500"></i> Scan for Misplaced</button>
                            </div>
                        </div>
                        
                        <!-- Scan Results Box (hidden initially) -->
                        <div id="scan-results-box" class="hidden border border-[#2a2f3a] border-l-4 border-l-[#2f8fc9] bg-[#16191f] rounded-xl p-3.5 space-y-2.5 shadow-md">
                            <!-- Header Row: Title, Badges, Filter, Clear -->
                            <div class="flex items-center justify-between pb-2 border-b border-[#2a2f3a]">
                                <div class="flex items-center gap-2.5">
                                    <span class="text-xs font-bold text-white flex items-center gap-1.5">
                                        <i class="fa-solid fa-clipboard-list text-[#2f8fc9]"></i> Scan Results
                                    </span>
                                    <span id="scan-results-summary" class="text-[10px] text-gray-300 font-medium px-2 py-0.5 rounded bg-[#20242c] border border-[#2a2f3a]"></span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <label for="scan-filter" class="text-[10px] text-gray-400 font-medium">Filter:</label>
                                    <select id="scan-filter" onchange="filterScanResults()" class="bg-[#20242c] border border-[#2a2f3a] text-gray-300 text-[10px] rounded px-2 py-1 outline-none font-semibold cursor-pointer focus:border-[#2f8fc9]">
                                        <option value="all">All Issues</option>
                                        <option value="duplicates">Duplicates only</option>
                                        <option value="misplaced">Misplaced only</option>
                                    </select>
                                    <button id="clear-results-btn" class="bg-[#20242c] hover:bg-[#2a2f3a] text-gray-400 hover:text-white text-[10px] font-semibold px-2.5 py-1 rounded border border-[#2a2f3a] transition-colors flex items-center gap-1 cursor-pointer" title="Dismiss scan results">
                                        <i class="fa-solid fa-xmark"></i> Clear
                                    </button>
                                </div>
                            </div>

                            <!-- Action Toolbar Row for Scan Items -->
                            <div id="scan-action-toolbar" class="flex flex-wrap items-center justify-between gap-2 text-xs">
                                <div class="flex items-center gap-2">
                                    <label id="select-all-misplaced-container" class="hidden flex items-center gap-1.5 text-[11px] text-gray-300 cursor-pointer select-none bg-[#20242c] border border-[#2a2f3a] px-2.5 py-1 rounded-lg hover:text-white transition-colors">
                                        <input type="checkbox" id="select-all-misplaced-cb" onchange="toggleSelectAllMisplaced(this)" class="accent-[#2f8fc9]">
                                        <span class="font-medium">Select All Issues</span>
                                    </label>
                                    <span id="misplaced-selected-count" class="text-[10px] text-[#2f8fc9] font-semibold"></span>
                                </div>

                                <div class="flex flex-wrap items-center gap-2">
                                    <button id="delete-duplicates-btn" class="hidden bg-red-950/60 hover:bg-red-900/60 border border-red-500/40 text-red-200 text-[10px] font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer">
                                        <i class="fa-solid fa-trash-can"></i> Delete Duplicates
                                    </button>
                                    <button id="move-misplaced-btn" class="hidden bg-[#20242c] hover:bg-[#2a2f3a] border border-[#2a2f3a] text-gray-300 text-[10px] font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer" title="Move selected misplaced videos to their rule target playlists (e.g. 1~Sort)">
                                        <i class="fa-solid fa-share-from-square text-[#2f8fc9]"></i> Move to Mapped
                                    </button>
                                    <select id="scan-target-playlist" onchange="updateMisplacedActions()" class="bg-[#20242c] border border-[#2a2f3a] text-gray-300 text-[10px] rounded-lg px-2.5 py-1.5 outline-none cursor-pointer focus:border-[#2f8fc9]">
                                        <option value="">Move selected to...</option>
                                    </select>
                                    <button id="move-custom-misplaced-btn" onclick="moveSelectedMisplacedToCustom()" disabled class="opacity-40 bg-[#2f8fc9] hover:bg-[#2a7db8] text-white text-[10px] font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer" title="Move selected videos to chosen playlist without changing channel mappings">
                                        <i class="fa-solid fa-arrow-right-to-bracket"></i> Move Selected
                                    </button>
                                    <button id="keep-misplaced-btn" disabled class="opacity-40 bg-[#20242c] hover:bg-[#2a2f3a] border border-[#2a2f3a] text-gray-300 text-[10px] font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer" title="Keep selected videos in this playlist without changing channel rules">
                                        <i class="fa-solid fa-anchor text-amber-400"></i> Keep Here
                                    </button>
                                    <button id="fix-mapping-btn" disabled class="opacity-40 bg-yellow-500/10 hover:bg-yellow-500/20 border border-yellow-500/30 text-yellow-400 text-[10px] font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer" title="Update channel mappings so selected channels permanently belong to this playlist">
                                        <i class="fa-solid fa-map-pin text-yellow-500"></i> Update Channel Mapping
                                    </button>
                                </div>
                            </div>

                            <!-- Scan Results List -->
                            <div id="scan-results-list" class="space-y-1.5 max-h-56 overflow-y-auto text-[11px] text-gray-300">
                                <!-- Populated dynamically -->
                            </div>
                        </div>
                    </div>

                    <!-- Sticky Control Bar Card (Toolbar) -->
                    <div id="playlist-toolbar-card" class="bento-card p-3 flex flex-wrap items-center gap-2 hidden">
                        <!-- Populated dynamically by playlist.js -->
                    </div>
                </div>

                <!-- Videos List Container -->
                <div class="bento-card p-0 max-w-4xl mx-auto" id="videos-container">
                    <div class="p-4 space-y-3" id="videos-skeleton">
                        <div class="animate-pulse space-y-3">
                            <div class="h-20 rounded bg-[#1e222a]"></div>
                            <div class="h-3 rounded bg-[#1e222a] w-3/4"></div>
                            <div class="h-3 rounded bg-[#1e222a] w-1/2"></div>
                        </div>
                        <div class="animate-pulse space-y-3">
                            <div class="h-20 rounded bg-[#1e222a]"></div>
                            <div class="h-3 rounded bg-[#1e222a] w-2/3"></div>
                            <div class="h-3 rounded bg-[#1e222a] w-1/3"></div>
                        </div>
                    </div>
                    <div class="hidden p-4" id="videos-list"></div>
                </div>
            </div>
        <script src="/static/playlist.js?v=20260709b"></script>
        <script src="/static/mobile-nav.js"></script>
    </main>
    </div>
</body>
</html>
