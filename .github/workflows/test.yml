name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff mypy psutil

      - name: Run Ruff Linter
        # Start with correctness errors. The repository's historical style
        # backlog is tracked separately and must not hide real runtime defects.
        run: ruff check app.py api core models services --select F821

      - name: Run Mypy Type Check
        run: mypy . --ignore-missing-imports || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify production CSS build
        run: |
          npm ci
          npm run build:css
          git diff --exit-code -- web/static/tailwind.css

      - name: Frontend behavior regressions
        run: node --test tests/frontend/*.cjs

      - name: Run Pytest
        run: pytest --cov=. --cov-report=xml

  production-gate:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Approve production deployment
        run: echo "All supported Python versions, frontend tests, lint, CSS, and pytest checks passed."
